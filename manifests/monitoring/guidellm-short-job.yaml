# Optional prep-day / short booth-burst GuideLLM job.
# Apply via setup/11-baseline-and-observability.sh or demo/scenarios/01-replay-benchmark/trigger.sh
# Placeholders MAAS_ENDPOINT_PLACEHOLDER and API_KEY_PLACEHOLDER are substituted by scripts.
#
# Fixes validated on dry-run:
# - :latest is arm64-only → use v0.7.1-amd64 (cluster nodes are amd64)
# - v0.7 ignores legacy GUIDELLM_* env vars → use `guidellm run` CLI flags
# - backend must include api_key= for MaaS (health check returns 401 otherwise)
apiVersion: batch/v1
kind: Job
metadata:
  name: guidellm-llmd-short
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/part-of: llm-d-demolab
    app.kubernetes.io/component: benchmark
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: guidellm-llmd-short
    spec:
      restartPolicy: Never
      containers:
        - name: guidellm
          image: ghcr.io/vllm-project/guidellm:v0.7.1-amd64
          imagePullPolicy: IfNotPresent
          env:
            - name: OPENAI_BASE_URL
              value: "MAAS_ENDPOINT_PLACEHOLDER"
            - name: OPENAI_API_KEY
              value: "API_KEY_PLACEHOLDER"
            - name: HF_HOME
              value: /tmp/hf-cache
            - name: TRANSFORMERS_CACHE
              value: /tmp/hf-cache
            - name: XDG_CACHE_HOME
              value: /tmp
            - name: HOME
              value: /tmp
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              guidellm run \
                --backend "kind=openai_http,target=${OPENAI_BASE_URL},model=llama-3-1-8b-instruct-fp8,api_key=${OPENAI_API_KEY}" \
                --data "kind=synthetic_text,prompt_tokens=512,output_tokens=64" \
                --profile "kind=concurrent,streams=32" \
                --constraint "kind=max_duration,seconds=60" \
                --output "kind=console" \
                --output "kind=json,path=/results/guidellm-llmd-short.json" \
                --tokenizer "kind=huggingface_auto,model=RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8-dynamic" \
                --disable-console-interactive
          volumeMounts:
            - name: cache
              mountPath: /tmp/hf-cache
            - name: benchmark-data
              mountPath: /results
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 2Gi
        - name: benchmark-data
          persistentVolumeClaim:
            claimName: benchmark-data
