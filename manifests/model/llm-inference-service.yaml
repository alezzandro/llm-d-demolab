apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: llama-3-1-8b-fp8
  namespace: models-as-a-service
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
  annotations:
    opendatahub.io/hardware-profile-name: gpu-l4-nvidia
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    opendatahub.io/model-type: generative
    # Links to manifests/model/oci-connection.yaml — required for Deployments Edit wizard
    opendatahub.io/connections: llama-3-1-8b-fp8-connection
    openshift.io/display-name: llama-3-1-8b-fp8-llm-d
    # MaaS owns gateway AuthPolicy (API keys). enable-auth=true makes
    # odh-model-controller attach {gateway}-authn and override MaaS.
    security.opendatahub.io/enable-auth: "false"
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"
spec:
  # Accelerator template only. Do NOT add the llm-scheduler preset while
  # fronting MaaS: InferencePool/EPP returned HTTP 200 with an empty body
  # for /v1/chat/completions (validated on RHOAI 3.4.2 dry-run; booth v1 on
  # 3.5 still uses Service LB). Multi-replica Service LB +
  # --enable-prefix-caching still demonstrates the GPU pool; P95 numbers:
  # docs/assets/baseline-comparison.md.
  #
  # Preset name is versioned (v3-4-2-...-template-nvidia-cuda vs
  # v3-5-0-...-single-node-template-nvidia-cuda). setup/06-deploy-llmd-model.sh
  # substitutes whatever LLMInferenceServiceConfig exists on the cluster.
  baseRefs:
    - name: v3-4-2-kserve-config-llm-template-nvidia-cuda
  model:
    uri: oci://registry.redhat.io/rhelai1/modelcar-llama-3-1-8b-instruct-fp8-dynamic:1.5
    name: llama-3-1-8b-instruct-fp8
  replicas: 4
  router:
    route: {}
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
  template:
    nodeSelector:
      node-role.kubernetes.io/worker-gpu: ""
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    containers:
      - name: main
        env:
          - name: VLLM_ADDITIONAL_ARGS
            # Open WebUI sends tool_choice=auto; requires auto tool choice + Llama 3.1 parser.
            value: "--disable-uvicorn-access-log --max-model-len=16000 --enable-prefix-caching --enable-auto-tool-choice --tool-call-parser llama3_json"
        resources:
          requests:
            cpu: "2"
            memory: 8Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: 16Gi
            nvidia.com/gpu: "1"
