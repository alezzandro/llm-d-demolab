          ]
        },
        {
          "label": "Concurrent @ 64",
          "metrics": [
            {"name": "TTFT median (ms)", "naive": 4492.7, "llmd": 245.8},
            {"name": "TTFT p95 (ms)", "naive": 24391.2, "llmd": 478.0}
          ]
        }
      ],
      "highlight": {
        "label": "Wow metric — TTFT p95 @ concurrency 64",
        "naive_ms": 24391.2,
        "llmd_ms": 478.0,
