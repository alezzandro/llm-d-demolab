apiVersion: v1
kind: ConfigMap
metadata:
  name: prefix-cache-lab-epp
  namespace: prefix-cache-lab
  labels:
    app: prefix-cache-lab
    app.kubernetes.io/part-of: llm-d-demolab
data:
  epp-baseline.json: |
    {
      "title": "Prefix-cache-aware routing (EPP) vs naive LB",
      "subtitle": "Showroom leave-behind — 4× GPU, Llama 3.1 8B Instruct FP8, GuideLLM concurrent",
      "note": "Live InferencePool/EPP through MaaS returns empty chat bodies on RHOAI 3.4.2. These numbers are the routing story; live buttons above prove prefix-caching under shared vs unique prompts.",
