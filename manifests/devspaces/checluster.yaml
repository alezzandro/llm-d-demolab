apiVersion: org.eclipse.che/v2
kind: CheCluster
metadata:
  name: devspaces
  namespace: openshift-devspaces
spec:
  components:
    cheServer:
      debug: false
    dashboard: {}
    devWorkspace: {}
    pluginRegistry: {}
  devEnvironments:
    startTimeoutSeconds: 600
    storage:
      pvcStrategy: per-user
    defaultNamespace:
      autoProvision: true
    # Do not put Open VSX item URLs in defaultPlugins. Che fetches those URIs
    # as Che plugin *devfiles*; HTML from open-vsx.org fails YAML parse and
    # the factory never starts ("mapping values are not allowed in this context").
    # Continue is installed via vscode-editor-configurations +
    # vscode-default-extensions ConfigMaps in the user namespace (phase 9).
---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-devspaces
