apiVersion: org.eclipse.che/v2
kind: CheCluster
metadata:
  name: devspaces
  namespace: openshift-devspaces
spec:
  components:
    cheServer:
      debug: false
    dashboard: {}
    devWorkspace: {}
    pluginRegistry: {}
  devEnvironments:
    startTimeoutSeconds: 600
    storage:
      pvcStrategy: per-user
    defaultNamespace:
      autoProvision: true
    # Install Continue (and Ansible/YAML helpers) in every che-code workspace.
    # .vscode/extensions.json in git is the project-level path; this covers
    # workspaces started before that file is pulled.
    # https://docs.redhat.com/en/documentation/red_hat_openshift_dev_spaces/3.29/develop-proc_automating_installation_of_vscode_extensions
    defaultPlugins:
      - editor: che-incubator/che-code/latest
        plugins:
          - https://open-vsx.org/vscode/item?itemName=Continue.continue
          - https://open-vsx.org/vscode/item?itemName=redhat.ansible
          - https://open-vsx.org/vscode/item?itemName=redhat.vscode-yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-devspaces
